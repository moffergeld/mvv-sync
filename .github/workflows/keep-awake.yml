name: Keep app awake (health ping)

on:
  schedule:
    - cron: "0 */8 * * *"   # elke 8 uur (UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping live dashboard(s)
        env:
          KEEP_AWAKE_URL: ${{ vars.KEEP_AWAKE_URL }}
          KEEP_AWAKE_SECONDARY_URL: ${{ vars.KEEP_AWAKE_SECONDARY_URL }}
        run: |
          set -euo pipefail

          primary_url="${KEEP_AWAKE_URL:-}"
          secondary_url="${KEEP_AWAKE_SECONDARY_URL:-}"

          if [ -z "$primary_url" ]; then
            primary_url="https://mvv-dashboard.streamlit.app/"
          fi

          urls=("$primary_url")
          if [ -n "$secondary_url" ]; then
            urls+=("$secondary_url")
          fi

          for url in "${urls[@]}"; do
            echo "Pinging $url"
            curl -fsSL --retry 3 --retry-delay 5 --max-time 45 \
              -A "mvv-keep-awake/1.0" \
              "${url}?keep_awake=1" \
              -o /dev/null
          done
