name: Keep app awake (health ping)

on:
  schedule:
    - cron: "0 */8 * * *"   # elke 8 uur (UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping live dashboard(s)
        env:
          KEEP_AWAKE_URL: ${{ vars.KEEP_AWAKE_URL }}
          KEEP_AWAKE_SECONDARY_URL: ${{ vars.KEEP_AWAKE_SECONDARY_URL }}
        run: |
          set -euo pipefail

          primary_url="${KEEP_AWAKE_URL:-}"
          secondary_url="${KEEP_AWAKE_SECONDARY_URL:-}"

          normalize_streamlit_health_url() {
            local raw_url="$1"
            local clean_url="${raw_url%%\?*}"
            clean_url="${clean_url%/}"

            if [[ "$clean_url" == *"/_stcore/health" ]]; then
              printf '%s\n' "$clean_url"
            else
              printf '%s/_stcore/health\n' "$clean_url"
            fi
          }

          if [ -z "$primary_url" ]; then
            primary_url="https://mvv-dashboard.streamlit.app"
          fi

          urls=("$(normalize_streamlit_health_url "$primary_url")")
          if [ -n "$secondary_url" ]; then
            urls+=("$(normalize_streamlit_health_url "$secondary_url")")
          fi

          for url in "${urls[@]}"; do
            echo "Pinging $url"
            curl -fsS --retry 3 --retry-delay 5 --max-time 45 \
              -A "mvv-keep-awake/1.0" \
              "$url" \
              -o /dev/null
          done
