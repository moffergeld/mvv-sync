name: Check cloud runtime

on:
  push:
    paths:
      - environment.yml
      - requirements.txt
      - scripts/check_cloud_runtime.py
      - .github/workflows/check-cloud-runtime.yml
  pull_request:
    paths:
      - environment.yml
      - requirements.txt
      - scripts/check_cloud_runtime.py
      - .github/workflows/check-cloud-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: true
      - name: Install the cloud environment into base
        run: conda env update --name base --file environment.yml
      - name: Check imports and native PDF libraries
        run: python scripts/check_cloud_runtime.py
      - name: Check installed Python dependencies
        run: python -m pip check
