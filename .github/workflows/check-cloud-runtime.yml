name: Check cloud runtime

on:
  push:
    paths:
      - requirements.txt
      - report_generator.py
      - app.py
      - roles.py
      - pages/**
      - tablet_app/**
      - scripts/check_cloud_runtime.py
      - .github/workflows/check-cloud-runtime.yml
  pull_request:
    paths:
      - requirements.txt
      - report_generator.py
      - app.py
      - roles.py
      - pages/**
      - tablet_app/**
      - scripts/check_cloud_runtime.py
      - .github/workflows/check-cloud-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the same Python requirements as Streamlit Cloud
        run: python -m pip install --requirement requirements.txt
      - name: Check dependencies, PDF fallback and FORMS contracts
        run: python scripts/check_cloud_runtime.py
      - name: Compile the app without loading secrets
        run: python -m compileall -q app.py roles.py pages tablet_app utils
      - name: Check installed Python dependencies
        run: python -m pip check
